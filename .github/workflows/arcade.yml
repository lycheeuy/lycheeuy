name: Update Pac-Man Contribution

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - name: Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: lycheeuy
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: pacman

      - name: Push generated SVG
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
